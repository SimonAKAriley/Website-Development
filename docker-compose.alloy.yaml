services:
  site:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
    command: bash -lc "npm install && npm run dev"

volumes:
  node_modules:
